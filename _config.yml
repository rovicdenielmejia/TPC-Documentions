# GitHub Pages Configuration
# This file configures GitHub Pages for your documentation site

# Site settings
title: "Loyalty Program - Terms & Conditions"
description: "Terms and conditions for the shop loyalty program"
baseurl: "" # Leave empty for root domain
url: "" # Your GitHub Pages URL will be: https://username.github.io/repository-name

# Build settings
markdown: kramdown
highlighter: rouge
theme: minima

# Exclude files from processing
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .git
  - .github

# Include files
include:
  - _redirects
  - .htaccess
